<script>
// ... keep all your functions same until saveHistory ...

// === FIXED HISTORY - 3 SETS ONLY + 5 BUTTONS + FULL DATA ===
function saveHistory(){
if(lotD.innerText=='-'||lotD.innerText==''){alert('Calculate first');return;}
let trade={
id:Date.now(),
pair:pairD.value,
cp:cpD.value,
sl:slD.value,
tp:tpD.value,
dh:dh.value, dl:dl.value, dc:dc.value,
wh:wh.value, wl:wl.value, wc:wc.value,
dR5:dR5.innerText, dR4:dR4.innerText, dR3:dR3.innerText, dR2:dR2.innerText, dR1:dR1.innerText, dP:dP.innerText, dS1:dS1.innerText, dS2:dS2.innerText, dS3:dS3.innerText, dS4:dS4.innerText, dS5:dS5.innerText,
wR5:wR5.innerText, wR4:wR4.innerText, wR3:wR3.innerText, wR2:wR2.innerText, wR1:wR1.innerText, wP:wP.innerText, wS1:wS1.innerText, wS2:wS2.innerText, wS3:wS3.innerText, wS4:wS4.innerText, wS5:wS5.innerText,
balFull:balInput.value, balType:balType.value,
bal95D:balD.innerText, bal95C:balC.innerText,
lotD:lotD.innerText, lotC:lotC.innerText,
profD:profD.innerText, profC:profC.innerText,
totD:totD.innerText, totC:totC.innerText,
appD:appD.innerText, appC:appC.innerText,
date:new Date().toLocaleString()
};
let hist=JSON.parse(localStorage.getItem('tmfx_history')||'[]');
hist.unshift(trade);
hist=hist.slice(0,3); // 3 SETS ONLY
localStorage.setItem('tmfx_history',JSON.stringify(hist));
mainCard.classList.add('hidden');box7.classList.remove('hidden');
loadHist();
}

function getFullText(h){
return `TMFX V4.6.7 FULL REPORT - 3 SETS
━━━━━━━━━━━━━━━
PAIR: ${h.pair}
CURRENT PRICE: ${h.cp}
SL: ${h.sl} | TP: ${h.tp}

HLC DAILY: H=${h.dh} L=${h.dl} C=${h.dc}
HLC WEEKLY: H=${h.wh} L=${h.wl} C=${h.wc}

R/S DAILY: R5=${h.dR5} R4=${h.dR4} R3=${h.dR3} R2=${h.dR2} R1=${h.dR1} P=${h.dP} S1=${h.dS1} S2=${h.dS2} S3=${h.dS3} S4=${h.dS4} S5=${h.dS5}
R/S WEEKLY: R5=${h.wR5} R4=${h.wR4} R3=${h.wR3} R2=${h.wR2} R1=${h.wR1} P=${h.wP} S1=${h.wS1} S2=${h.wS2} S3=${h.wS3} S4=${h.wS4} S5=${h.wS5}

BALANCE:
Type: ${h.balType} Full: ${h.balFull}
95% D: ${h.bal95D} | 95% C: ${h.bal95C}

LOT CALC:
Approval D:${h.appD} C:${h.appC}
LOT D:${h.lotD} C:${h.lotC}
PROFIT D:$${h.profD} C:${h.profC}¢
100%balance+prof D:$${h.totD} C:${h.totC}¢
Date: ${h.date}
━━━━━━━━━━━━━━━`;
}

function loadHist(){
let hist=JSON.parse(localStorage.getItem('tmfx_history')||'[]');
let list=document.getElementById('historyList');
if(!hist.length){list.innerHTML='<div style="text-align:center;color:#7aa3c7;padding:10px">No history</div>';return;}
list.innerHTML=hist.map((h,i)=>`
<div class="histItem">
<b style="color:#fbbf24">${h.pair} | ${h.cp} | ${h.date}</b>
<div style="color:#fff;font-size:10px;margin-top:4px">Lot D:${h.lotD} C:${h.lotC} | 100%balance+prof $${h.totD} | 95% ${h.bal95D}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<button style="background:#0f2d5a;color:#60a5fa;border:1px solid #3b82f6;padding:11px;border-radius:6px;font-weight:900;font-size:9px" onclick="recallTrade(${i})">📞 RECALL</button>
<button style="background:#1e3a5f;color:#7dd3fc;border:1px solid #38bdf8;padding:11px;border-radius:6px;font-weight:900;font-size:9px" onclick="shareCopy(${i})">🔗 SHARE</button>
<button style="background:#fbbf24;color:#000;padding:11px;border-radius:6px;font-weight:900;font-size:9px" onclick="exportOne(${i})">📤 EXPORT</button>
<button style="background:#128c7e;color:#fff;padding:11px;border-radius:6px;font-weight:900;font-size:9px" onclick="shareWA(${i})">📱 WhatsApp</button>
<button style="background:#052e16;color:#22c55e;border:1px solid #22c55e;padding:11px;border-radius:6px;font-weight:900;font-size:9px;grid-column:span 2" onclick="copyOne(${i})">📋 COPY FULL DATA</button>
</div>
</div>`).join('');
}
function recallTrade(i){let h=JSON.parse(localStorage.getItem('tmfx_history')||'[]')[i];pairD.value=h.pair;cpD.value=h.cp;slD.value=h.sl;tpD.value=h.tp;dh.value=h.dh;dl.value=h.dl;dc.value=h.dc;wh.value=h.wh;wl.value=h.wl;wc.value=h.wc;backToCalc();}
function shareWA(i){let h=JSON.parse(localStorage.getItem('tmfx_history')||'[]')[i];window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(getFullText(h)),'_blank');}
function shareCopy(i){let h=JSON.parse(localStorage.getItem('tmfx_history')||'[]')[i];navigator.clipboard.writeText(getFullText(h));alert('FULL DATA Copied for Share');}
function copyOne(i){let h=JSON.parse(localStorage.getItem('tmfx_history')||'[]')[i];navigator.clipboard.writeText(getFullText(h));alert('FULL DATA Copied!');}
function exportOne(i){let h=JSON.parse(localStorage.getItem('tmfx_history')||'[]')[i];let blob=new Blob([getFullText(h)],{type:'text/plain'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`TMFX_${h.pair}_FULL_${h.id}.txt`;a.click();}

// Update TOTAL label
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('totD').parentElement.querySelector('td').innerHTML='TOTAL<br><span style="font-size:8px">100%balance+prof</span>';
});
</script>
